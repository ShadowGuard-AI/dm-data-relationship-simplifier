<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Celtic Ogham roadside in three bands: dusk lowering over fields and treeline in the far band, shadows lengthening from standing stones across the road in the middle band, and raking light travelling down the notch groups on the foreground stone edge in the near band">
<rect width="900" height="300" fill="#c9cfd0"/>
<!-- far band: fields and treeline, only the light moves -->
<rect x="0" y="0" width="900" height="100" fill="#5e686b"/>
<rect x="0" y="0" width="900" height="100" fill="#d9a441" opacity="0.18"><animate attributeName="opacity" values="0.18; 0.04; 0.18" dur="16s" repeatCount="indefinite"/></rect>
<g fill="#464e42"><ellipse cx="120" cy="52" rx="30" ry="34"/><ellipse cx="220" cy="46" rx="26" ry="30"/><ellipse cx="330" cy="54" rx="32" ry="36"/><ellipse cx="450" cy="48" rx="27" ry="31"/><ellipse cx="560" cy="52" rx="31" ry="35"/><ellipse cx="680" cy="46" rx="26" ry="30"/><ellipse cx="790" cy="54" rx="32" ry="34"/></g>
<g fill="#4a341e"><rect x="116" y="76" width="7" height="22"/><rect x="216" y="70" width="7" height="24"/><rect x="326" y="80" width="7" height="20"/><rect x="446" y="72" width="7" height="22"/><rect x="556" y="78" width="7" height="20"/><rect x="676" y="70" width="7" height="24"/><rect x="786" y="78" width="7" height="20"/></g>
<rect x="0" y="92" width="900" height="10" fill="#8a9396"/>
<!-- middle band: road and farther stones, shadows lengthen, stones stand -->
<polygon points="0,196 330,150 620,132 900,128 900,168 640,178 360,196 0,220" fill="#7e705c"/>
<g><polygon points="520,196 520,150 560,196" fill="#2b2b2e" opacity="0.28"><animate attributeName="points" values="520,196 520,150 560,196; 520,196 520,150 640,196; 520,196 520,150 560,196" dur="16s" repeatCount="indefinite"/></polygon>
<polygon points="500,108 532,102 532,196 500,196" fill="#8a9396" stroke="#2b2b2e" stroke-width="2"/><line x1="522" y1="104" x2="522" y2="196" stroke="#2b2b2e" stroke-width="3"/><g stroke="#2b2b2e" stroke-width="3"><line x1="506" y1="128" x2="538" y2="128"/><line x1="506" y1="138" x2="538" y2="138"/><line x1="506" y1="164" x2="538" y2="156"/></g></g>
<g><polygon points="706,178 706,140 734,178" fill="#2b2b2e" opacity="0.25"><animate attributeName="points" values="706,178 706,140 734,178; 706,178 706,140 796,178; 706,178 706,140 734,178" dur="16s" repeatCount="indefinite"/></polygon>
<polygon points="690,118 716,114 716,178 690,178" fill="#9aa3a5" stroke="#2b2b2e" stroke-width="2"/><line x1="707" y1="115" x2="707" y2="178" stroke="#2b2b2e" stroke-width="2"/><g stroke="#2b2b2e" stroke-width="2"><line x1="696" y1="136" x2="718" y2="136"/><line x1="696" y1="144" x2="718" y2="144"/><line x1="696" y1="160" x2="718" y2="160"/></g></g>
<!-- near band: foreground stone edge, raking light travels down the arris -->
<rect x="0" y="204" width="900" height="96" fill="#6d7779"/>
<polygon points="60,204 190,204 190,300 60,300" fill="#8a9396"/>
<polygon points="190,204 232,212 232,300 190,300" fill="#788386"/>
<line x1="190" y1="204" x2="190" y2="300" stroke="#2b2b2e" stroke-width="4"/>
<g stroke="#2b2b2e" stroke-width="5"><line x1="164" y1="222" x2="216" y2="222"/><line x1="164" y1="234" x2="216" y2="234"/><line x1="164" y1="258" x2="216" y2="250"/><line x1="164" y1="272" x2="216" y2="264"/><line x1="190" y1="282" x2="190" y2="296"/></g>
<rect x="150" y="210" width="86" height="14" fill="#d9a441" opacity="0"><animate attributeName="opacity" values="0; 0.75; 0; 0; 0" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="210; 210; 246; 246; 282" dur="12s" repeatCount="indefinite"/></rect>
<rect x="40" y="292" width="220" height="8" fill="#4a341e"/>
<g stroke="#2b2b2e" stroke-width="3"><line x1="330" y1="238" x2="420" y2="238"/><line x1="352" y1="256" x2="398" y2="256"/><line x1="470" y1="238" x2="560" y2="238"/></g>
</svg>
